<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu pareja</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sorteo.css') }}" />
    <style>
      .card {
        width: min(100%, 36.75rem);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgb(205 147 58 / 36%);
        }
        70% {
          box-shadow: 0 0 0 22px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      p {
        font-size: 1.2rem;
        line-height: 1.45;
        margin-top: 0;
      }
      .roulette {
        box-sizing: border-box;
        margin: 1.5rem auto 1rem;
        width: min(220px, 100%);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 5px solid #cc923e;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: pulse 1.5s infinite;
      }
      .roulette::after {
        content: "";
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 10px solid transparent;
        border-right: 10px solid transparent;
        border-bottom: 18px solid var(--dorado-oscuro);
      }
      .roulette-inner {
        box-sizing: border-box;
        width: calc(100% - 16px);
        height: calc(100% - 16px);
        border-radius: 50%;
        background: radial-gradient(circle at top, #385677, var(--azul-profundo));
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1rem;
        font-weight: bold;
        color: var(--dorado-claro);
      }
      .partner {
        font-size: 2rem;
        margin: 1rem 0 0.2rem;
        font-weight: bold;
        color: var(--dorado-oscuro);
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }
      .partner.show {
        opacity: 1;
      }
      .hidden {
        display: none;
      }
      .warning {
        color: #684019;
        background: #ffedcc;
        border-radius: 10px;
        padding: 0.75rem;
        margin-top: 1rem;
        border: 1px solid #dfb878;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
      }
      .subtext {
        color: var(--azul-suave);
        margin-bottom: 1rem;
      }
      @media (max-width: 520px) {
        .warning {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="{{ url_for('static', filename='img/pesebre-nevado.png') }}"
        alt="Pesebre nevado bajo una estrella dorada"
        width="1354"
        height="1161"
        class="hero-image"
      />
      <h1>Quien será tu amigo secreto?</h1>
      <p class="subtext">Celebremos con espíritu navideño</p>
      <p>Hola {{ name }}, tu amigo secreto es:</p>
      <div
        class="roulette"
        id="roulette"
        data-names='{{ (participants or []) | tojson }}'
      >
        <div class="roulette-inner">
          <span id="roulette-text">¿Quién será?</span>
        </div>
      </div>
      <div class="partner" id="partner" data-partner="{{ partner }}">
        {{ partner }}
      </div>
      {% if partner.startswith('SIN PAREJA') %}
      <div class="warning">
        Por ahora no hay más participantes disponibles para asignar tu amigo secreto.
      </div>
      {% endif %}
      <a class="primary-action" href="/">Volver al inicio</a>
    </div>
    <script>
      const rouletteEl = document.getElementById("roulette");
      const partnerEl = document.getElementById("partner");
      const textEl = document.getElementById("roulette-text");
      const namesData = rouletteEl.dataset.names || "[]";
      const names = JSON.parse(namesData);
      const finalName = partnerEl.dataset.partner;
      if (!names.includes(finalName)) {
        names.push(finalName);
      }
      let pool = [];
      const duration = 5200;
      const step = Math.min(130, Math.floor((duration - 200) / names.length));
      const interval = setInterval(() => {
        if (!pool.length) {
          pool = [...names];
          for (let index = pool.length - 1; index > 0; index -= 1) {
            const other = Math.floor(Math.random() * (index + 1));
            [pool[index], pool[other]] = [pool[other], pool[index]];
          }
          const lastIndex = pool.length - 1;
          if (lastIndex > 0 && pool[lastIndex] === textEl.textContent) {
            [pool[0], pool[lastIndex]] = [pool[lastIndex], pool[0]];
          }
        }
        textEl.textContent = pool.pop();
      }, step);
      const scrollToRoulette = () => {
        const offset = rouletteEl.getBoundingClientRect().top + window.scrollY - 120;
        window.scrollTo({ top: Math.max(offset, 0), behavior: "smooth" });
      };
      scrollToRoulette();
      setTimeout(() => {
        clearInterval(interval);
        rouletteEl.classList.add("hidden");
        partnerEl.classList.add("show");
      }, duration);
    </script>
  </body>
</html>
