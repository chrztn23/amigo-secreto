<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amigo Secreto desayuno Edición 17</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='sorteo.css') }}" />
    <style>
      form {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 1rem;
        margin-top: 1rem;
      }
      label {
        font-size: 1.2rem;
        line-height: 1.45;
        color: var(--azul-suave);
      }
      select {
        width: 100%;
        padding: 0.9rem;
        border: 1px solid #bb9d77;
        border-radius: 12px;
        background: var(--crema-claro);
        color: var(--azul-profundo);
        font-family: inherit;
        font-size: 1.05rem;
      }
      button {
        cursor: pointer;
      }
      .alert {
        background: #fff0e8;
        color: #802f24;
        border-radius: 10px;
        padding: 0.75rem;
        margin-bottom: 1rem;
        font-size: 0.95rem;
        text-align: left;
        border: 1px solid #deac9a;
      }
      .alert p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="{{ url_for('static', filename='img/pesebre-nevado.png') }}"
        alt="Pesebre nevado bajo una estrella dorada"
        width="1354"
        height="1161"
        class="hero-image"
      />
      <h1>Amigo Secreto</h1>
      {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="alert" role="alert">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
      </div>
      {% elif draw_notice %}
      <div class="alert" role="status"><p>{{ draw_notice }}</p></div>
      {% endif %}
      {% endwith %}
      <form method="POST" action="/asignar">
        <label for="name-select">Selecciona tu nombre y conoceras a tu amigo secreto:</label>
        <select name="name" id="name-select" {% if not available_names %}disabled{% endif %}>
          {% if available_names %}
          <option value="">Selecciona tu nombre</option>
          {% for name in available_names %}
          <option value="{{ name }}">{{ name }}</option>
          {% endfor %}
          {% else %}
          <option value="" disabled>No hay nombres disponibles</option>
          {% endif %}
        </select>
        <button class="primary-action" type="submit" {% if not available_names or draw_notice %}disabled{% endif %}>
          Enviar
        </button>
      </form>
    </div>
  </body>
</html>
